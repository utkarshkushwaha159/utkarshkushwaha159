  </g>

  <!-- Main Introduction -->
  <g transform="translate(40, 130)">
    <text x="0" y="20" class="title-main" font-size="22">Hey! I'm <tspan class="title-highlight">Utkarsh Kushwaha</tspan></text>
    <text x="0" y="48" class="body-lead">A Computer Science undergraduate at <tspan font-weight="700" fill="#FFFFFF">NIET, Greater Noida</tspan>,</text>
    <text x="0" y="70" class="body-lead">passionate about building technology that solves real-world problems.</text>

    <!-- Quote Block with Vertical Cyan Line -->
    <rect x="0" y="92" width="3.5" height="66" rx="2" fill="#00F2FE" />
    <text x="16" y="108" class="body-sub">I enjoy exploring how things work, turning ideas into practical projects,</text>
    <text x="16" y="128" class="body-sub">and continuously improving my problem-solving skills. I love working</text>
    <text x="16" y="148" class="body-sub">on web development, open-source contributions and AI-driven solutions.</text>
  </g>

