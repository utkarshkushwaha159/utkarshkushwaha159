      <rect x="16" y="18" width="16" height="11" rx="1.5" fill="none" stroke="#C084FC" stroke-width="1.5" />
      <line x1="13" y1="30" x2="35" y2="30" stroke="#C084FC" stroke-width="1.5" stroke-linecap="round" />
      <text x="0" y="65" class="item-title">Build</text>
      <text x="0" y="82" class="item-desc">Turn ideas into</text>
      <text x="0" y="96" class="item-desc">meaningful</text>
      <text x="0" y="110" class="item-desc">projects</text>
    </g>

