      <path d="M 24 16 A 5 5 0 0 0 19 21 C 19 23.5 21 25 21 27 L 27 27 C 27 25 29 23.5 29 21 A 5 5 0 0 0 24 16 Z M 22 29 L 26 29" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-linecap="round" />
      <text x="0" y="65" class="item-title">Learn</text>
