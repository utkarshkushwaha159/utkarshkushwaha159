    <path d="M 16 10 A 4 4 0 1 0 16 18 A 4 4 0 1 0 16 10 Z M 10 24 C 10 20.5 13 19 16 19 C 19 19 22 20.5 22 24 Z" fill="#00F2FE" />
    <text x="44" y="24" class="title-main">About Me</text>
