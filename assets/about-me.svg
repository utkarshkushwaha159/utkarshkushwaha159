      <path d="M 17 28 L 22 22 L 26 25 L 32 17 M 28 17 L 32 17 L 32 21" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="0" y="65" class="item-title">Improve</text>
      <text x="0" y="82" class="item-desc">Solve tough</text>
      <text x="0" y="96" class="item-desc">problems &amp;</text>
      <text x="0" y="110" class="item-desc">grow skills</text>
    </g>
