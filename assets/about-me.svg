      <circle cx="20" cy="21" r="3" fill="#2DD4BF" />
      <circle cx="28" cy="21" r="3" fill="#2DD4BF" />
      <path d="M 15 28 C 15 25 18 25 20 25 C 22 25 25 25 25 28" fill="none" stroke="#2DD4BF" stroke-width="1.5" />
