    <rect x="178" y="0" width="155" height="30" rx="15" fill="#6B21A8" fill-opacity="0.1" stroke="#C084FC" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="192" cy="15" r="4" fill="#C084FC" />
